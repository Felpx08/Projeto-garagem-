<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel | Garagem 617</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="adm">

<!-- LOGIN -->
<div id="login" class="login">
  <form class="card login__box" id="loginForm">
    <a class="logo" href="../"><span class="logo__mark">617</span><span class="logo__txt">GARAGEM<small>PAINEL ADMINISTRATIVO</small></span></a>
    <label class="f">E-mail<input type="email" name="email" required autocomplete="username"></label>
    <label class="f">Senha<input type="password" name="password" required autocomplete="current-password"></label>
    <p class="err" id="loginErr" hidden></p>
    <button class="btn btn--block" type="submit">ENTRAR</button>
    <p class="muted small center" id="demoHint" hidden></p>
    <a class="muted small center" href="../">← Voltar ao site</a>
  </form>
</div>

<!-- APP -->
<div id="app" class="app" hidden>
  <aside class="side" id="side">
    <a class="logo" href="../"><span class="logo__mark">617</span><span class="logo__txt">GARAGEM<small>PAINEL</small></span></a>
    <nav class="side__nav" id="sideNav">
      <button data-tab="dashboard" class="on">Dashboard</button>
      <button data-tab="appointments">Agendamentos</button>
      <button data-tab="quotes">Orçamentos</button>
      <button data-tab="services">Serviços</button>
      <button data-tab="works">Trabalhos</button>
      <button data-tab="reviews">Avaliações</button>
      <button data-tab="site">Site e contato</button>
    </nav>
    <div class="side__foot">
      <a class="btn btn--ghost btn--sm btn--block" href="../" target="_blank">VER SITE</a>
      <button class="btn btn--ghost btn--sm btn--block" id="logoutBtn" type="button">SAIR</button>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="burger" id="admBurger" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
      <h1 id="tabTitle">Dashboard</h1>
    </header>
    <div class="demo-banner" id="demoBanner" hidden>MODO DEMONSTRAÇÃO — os dados ficam só neste navegador. Configure o Supabase em <code>assets/js/config.js</code> para usar o banco de dados real.</div>
    <section id="view" class="view"></section>
  </div>
</div>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true">
  <div class="modal__box"><button class="modal__x" id="modalX" aria-label="Fechar">×</button><div id="modalBody"></div></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/admin.js"></script>
</body>
</html>
